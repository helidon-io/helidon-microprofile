security:
  jersey:
    authorize-annotated-only: true
  providers:
    # Configuration of security providers
    - http-basic-auth:
        # https://tools.ietf.org/html/rfc2617
        realm: "mic"
        users:
          - login: "jack"
            password: "jackIsGreat"
            roles: [ "user", "admin" ]
          - login: "jill"
            # AES is no longer supported, and this is a test of authentication, not encryption
            password: "password"
            roles: [ "user" ]
