name: "Validate"

on:
  pull_request:
  push:
    branches-ignore: [ 'main', 'helidon-*.x', 'release-*' ]
    tags-ignore: [ '**' ]
  workflow_call:
    inputs:
      ref:
        description: The branch, tag or SHA to checkout
        required: false
        type: string
        default: ''

env:
  MVN_VERSION: 3.9.9
  JAVA_VERSION: 21
  JAVA_DISTRO: oracle
  MVN_ARGS: |
    -B -fae -e
    -Dmaven.wagon.httpconnectionManager.ttlSeconds=60
    -Dmaven.wagon.http.retryHandler.count=3
    -Djdk.toolchain.version=${JAVA_VERSION}
    -Dcache.enabled=true

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prime-build:
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/powershell
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRO }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Helidon Priming build
        run: |
          mkdir -p ~/.m2/repository/io/helidon/
          echo "empty file" > ~/.m2/repository/io/helidon/empty.txt
          etc/scripts/prime-build.sh
      - name: Upload Maven Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
          retention-days: 1
  checkstyle:
    needs: prime-build
    timeout-minutes: 5
    runs-on: ubuntu-22.04
    steps:
      - name: Download Maven Artifacts
        uses: actions/download-artifact@v4
        with:
          name: io-helidon-maven-artifacts
          path: ~/.m2/repository/io/helidon
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/common
        with:
          run: etc/scripts/checkstyle.sh

  gate:
    runs-on: ubuntu-22.04
    needs: [ checkstyle ]
    steps:
      - shell: bash
        run: |
          echo OK
